<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global.css"> 
    <link rel="shortcut icon" href="asset/imgs/favicon_io/favicon.ico" type="image">
    <title>Intégration-html-css</title>
</head>
<body>
    <!-- Début Entête de la page -->
    <Header>
        <section class="section-header">
            <div class="box-titre-header">
                <h1>Header</h1>
            </div>
        </section>
    </Header>
     <!-- Fin Entête de la page -->

     <!-- Début Corps de la page -->
    <main>
        <!-- Début first-child du main -->
        <section class="section-nav">
            <nav class="nav">
                <h1>NAV</h1>
            </nav>
        </section>
        <!-- Fin first-child du main  -->

        <!-- Début last-child du main -->
        <section class="section-hero">
            <div class="section-titres">
                <h1>HERO SECTION</h1>
                <h2>Titre de bienvenue</h2>
                <h3>Titre de bienvenue</h3>
                <button>Bouton</button>
            </div>

            <div class="Titre-services">
                <h1>SERVICES</h1> 
            </div>
            
            <!-- sous-sections contenant les services -->
            <section class="Section-box-services">
                <div class="box-services">
                    <h1>SERVICES 1</h1>
                </div>
                
                <div class="box-services">
                    <h1>SERVICES 2</h1>
                </div>
                
                <div class="box-services">
                    <h1>SERVICES 3</h1>
                </div>
            </section>
        </section>
        <!-- Fin last-child du main -->
    </main>
    <!-- Fin Corps de la page -->

    <!-- Début Pied de la page -->
    <footer>
        <div class="section-info">
            <h1>SECTION INFO</h1>
        </div>

        <div class="section-footer">
            <h1>FOOTER</h1>
        </div>
    </footer>
     <!-- Fin Pied de la page -->    
</body>
</html>
